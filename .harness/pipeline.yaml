pipeline:
  name: ruby-client-repo
  identifier: rubyclientrepo
  projectIdentifier: Harness_Split
  orgIdentifier: PROD
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: fmegithubharnessgitops
        repoName: ruby-client
        build:
          type: branch
          spec:
            branch: <+input>
  stages:
    - stage:
        name: Build and Test
        identifier: Build_and_Test
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          envVariables:
            CI_ENABLE_HCLI_FOR_TESTS: "true"
          caching:
            enabled: true
            override: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec:
              size: flex
          execution:
            steps:
              - step:
                  type: Run
                  name: Install Ruby
                  identifier: Install_Ruby
                  spec:
                    shell: Bash
                    command: |-
                      curl https://mise.run | sh
                      export PATH="$HOME/.local/bin:$PATH"
                      mise use --global ruby@<+matrix.rubyVersion>
                      ruby --version
                      gem --version
              - step:
                  type: Run
                  name: Start Redis
                  identifier: Start_Redis
                  spec:
                    shell: Sh
                    command: |-
                      apt-get update
                      apt-get install -y redis-server -qq
                      redis-server --daemonize yes --port 6379
                      redis-cli ping
              - step:
                  type: Run
                  name: Wait for Redis
                  identifier: Wait_for_Redis
                  spec:
                    shell: Sh
                    command: |-
                      for i in $(seq 1 15); do
                        redis-cli ping && break
                        echo "Waiting for Redis... attempt $i"
                        sleep 1
                      done
              - step:
                  type: Run
                  name: Install Dependencies
                  identifier: Install_Dependencies
                  spec:
                    shell: Bash
                    command: |-
                      export PATH="$HOME/.local/bin:$PATH"
                      eval "$(mise activate bash)"
                      gem install bundler:2.4.19 --no-document
                      bundle install --jobs 4 --retry 3
              - step:
                  type: Run
                  name: Run Tests
                  identifier: Run_Tests
                  spec:
                    shell: Bash
                    command: |-
                      export PATH="$HOME/.local/bin:$PATH"
                      eval "$(mise activate bash)"
                      bundle exec rake
              - step:
                  type: Run
                  name: Fix Coverage Paths
                  identifier: Fix_Coverage_Paths
                  when:
                    stageStatus: Success
                    condition: <+matrix.rubyVersion> == "3.2.2"
                  spec:
                    shell: Bash
                    command: |-
                      export PATH="$HOME/.local/bin:$PATH"
                      eval "$(mise activate bash)"
                      cd coverage
                      ruby -rjson -e '
                        sqube = JSON.load(File.read(".resultset.json"))["RSpec"]["coverage"].transform_values {|lines| lines["lines"]}
                        total = { "RSpec" => { "coverage" => sqube, "timestamp" => Time.now.to_i }}
                        puts JSON.dump(total)
                      ' > .resultset.sonarqube.json
                      ruby -rjson -e '
                        data = JSON.load(File.read(".resultset.json"))
                        cov = data["RSpec"]["coverage"]
                        File.open("lcov.info", "w") do |out|
                          cov.each do |path, info|
                            lines = info.is_a?(Hash) ? info["lines"] : info
                            next unless lines
                            rel = path.sub(%r{^/harness/}, "")
                            out.puts "SF:#{rel}"
                            lines.each_with_index do |hits, idx|
                              next if hits.nil?
                              out.puts "DA:#{idx + 1},#{hits}"
                            end
                            out.puts "end_of_record"
                          end
                        end
                      '
                      test -s lcov.info
              - step:
                  name: harnessCoverage
                  identifier: harnessCoverage
                  when:
                    stageStatus: Success
                    condition: <+matrix.rubyVersion> == "3.2.2"
                  template:
                    templateRef: account.codeCoverage
                    versionLabel: v1
                    templateInputs:
                      type: Run
                      spec:
                        envVariables:
                          patch_coverage_percent: "80"
                          file_path: "coverage/lcov.info"
                          overall_coverage_percent: ""
                          ignore_failure: "true"
                          exclude: "**/spec/**,**/vendor/**"
        strategy:
          matrix:
            rubyVersion:
              - 2.7.8
              - 3.2.2
